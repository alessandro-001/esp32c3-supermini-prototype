# PlatformIO Project Configuration File
[env:lolin_c3_mini]
platform   = espressif32@6.9.0
board      = lolin_c3_mini
framework  = arduino

#! Common settings for all environments
monitor_speed = 115200
upload_speed  = 115200

#! Upload using built-in USB (auto-reset via 1200bps touch — no BOOT button needed)
upload_protocol                     = esptool
board_upload.use_1200bps_touch      = true
board_upload.wait_for_upload_port   = true

#! Main environment for development
build_flags = -DCORE_DEBUG_LEVEL=0

#! Common libraries for all environments
lib_deps =
    adafruit/Adafruit NeoPixel @ ^1.12.3
    adafruit/Adafruit SHTC3 Library @ ^1.0.1
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    adafruit/Adafruit BusIO @ ^1.16.1
    #adafruit/Adafruit SCD4x Library @ ^1.0.4 # SCD40 
    knolleary/PubSubClient @ ^2.8.0
    bblanchon/ArduinoJson@^6.21.0
    dfrobot/DFRobot_ENS160

#! Native environment for testing on host machine
; [env:native]
; platform = native
; test_filter = native/*
; build_flags = -std=c++17
; build_src_filter = +<native_stub.cpp>   ; only compile the stub — skip all Arduino files
; lib_deps = bblanchon/ArduinoJson@^6.21.0

[env:test]
platform = native
build_flags = -DENABLE_TESTS=1 -std=c++17
test_filter = native/*
build_src_filter = +<native_stub.cpp>
lib_deps = bblanchon/ArduinoJson@^6.21.0

