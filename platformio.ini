# PlatformIO Project Configuration File
[env:lolin_c3_mini]
platform   = espressif32@6.9.0
board      = lolin_c3_mini 
framework  = arduino
#esp32-c3-devkitm-1
#! Common settings for all environments
monitor_speed = 115200
upload_speed  = 115200

#! Upload using built-in USB (auto-reset via 1200bps touch — no BOOT button needed)
upload_protocol                     = esptool
board_upload.use_1200bps_touch      = true
board_upload.wait_for_upload_port   = true

#! Main environment for development
build_flags = 
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCONFIG_PM_ENABLE=0

#! Libraries
lib_deps = 
	adafruit/Adafruit NeoPixel @ ^1.12.3
	adafruit/Adafruit Unified Sensor @ ^1.1.14
	adafruit/Adafruit BusIO @ ^1.16.1
	knolleary/PubSubClient @ ^2.8.0
	bblanchon/ArduinoJson@^6.21.0

[env:test]
platform = native
build_flags = -DENABLE_TESTS=1 -std=c++17
test_filter = native/*
build_src_filter = +<native_stub.cpp>
lib_deps = 
	bblanchon/ArduinoJson@^6.21.0
